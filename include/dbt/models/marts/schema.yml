version: 2
models:
  - name: int_oddsapi_consensus
    columns:
      - name: team_code
        data_tests: [not_null]
  - name: fct_price_snapshot
    data_tests:
      - unique:
          arguments:
            column_name: "concat(venue, '|', market_id, '|', team_code, '|', cast(snapshot_ts as string))"
    columns:
      - name: venue
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['oddsapi', 'polymarket']
      - name: league
        data_tests:
          - accepted_values:
              arguments:
                values: ['nba', 'nhl', 'nfl']
      - name: market_id
        data_tests: [not_null]
      - name: team_code
        data_tests: [not_null]
  - name: fct_cross_venue_gap
    data_tests:
      - unique:
          arguments:
            column_name: "concat(league, '|', cast(game_date as string), '|', matchup_code, '|', team_code, '|', cast(snapshot_hour as string))"
    columns:
      - name: abs_gap
        data_tests: [not_null]
  - name: dim_game
    data_tests:
      - unique:
          arguments:
            column_name: "concat(league, '|', cast(game_date as string), '|', matchup_code)"
    columns:
      - name: matchup_code
        data_tests: [not_null]
  - name: fct_game_result
    data_tests:
      - unique:
          arguments:
            column_name: "concat(league, '|', cast(game_date as string), '|', matchup_code)"
    columns:
      - name: winner_code
        data_tests: [not_null]
  - name: rpt_game_gap
    data_tests:
      - unique:
          arguments:
            column_name: "concat(league, '|', cast(game_date as string), '|', matchup_code, '|', cast(snapshot_hour as string))"