name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # dummy values: nothing here talks to GCP (DagBag import + dbt parse/ls only)
      GCP_PROJECT: ci
      GCS_BUCKET: ci
      ODDS_API_KEY: ci
      GOOGLE_APPLICATION_CREDENTIALS: ""
      AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: '{"conn_type":"google_cloud_platform","extra":{"keyfile_dict":"{\"type\":\"service_account\",\"project_id\":\"ci\"}","project":"ci"}}'
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      # dbt-bigquery and providers-google need incompatible google-cloud-storage, so two envs
      DBT_EXECUTABLE_PATH: ${{ github.workspace }}/.venv-dbt/bin/dbt
      AIRFLOW_HOME: ${{ github.workspace }}/.ci-airflow-home
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: ${{ github.workspace }}
      # Cosmos caches dbt ls in an Airflow Variable, which needs a metadata DB CI doesn't have
      AIRFLOW__COSMOS__ENABLE_CACHE_DBT_LS: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Airflow env
        run: pip install -r requirements.txt "apache-airflow==3.3.*" pytest

      - name: Install dbt env
        run: |
          python -m venv .venv-dbt
          .venv-dbt/bin/pip install dbt-bigquery==1.12.1

      - name: dbt parse
        working-directory: include/dbt
        run: |
          "$DBT_EXECUTABLE_PATH" deps --profiles-dir .
          "$DBT_EXECUTABLE_PATH" parse --profiles-dir . --warn-error

      - name: pytest
        run: pytest tests/
